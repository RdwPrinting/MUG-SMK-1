<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>RDW Printing - Review Desain</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,500;0,700;0,800;1,700;1,900&display=swap"><style id="app-style">
/* Layout: poster tegak 1 kolom, kolase 5x5 di tengah, ornamen produk melayang di sisi */
:root{
  --navy:#0c2a86; --blue:#1448c8; --red:#d4101f; --red2:#ff3040;
  --ink:#10163a; --line:#b7bcc8; --page:#e9eef8; --paper:#f6f8fd;
  --font:'Montserrat',system-ui,-apple-system,'Segoe UI',sans-serif;
}
html,body{background:var(--page)}
body{font-family:var(--font);color:var(--ink);-webkit-tap-highlight-color:transparent}
*{box-sizing:border-box}
button{font-family:inherit;cursor:pointer;border:0}

.poster{position:relative;max-width:560px;min-height:100vh;margin:0 auto;overflow:hidden;
  background:radial-gradient(120% 60% at 20% 30%,#fff 0%,#f3f6fc 60%,#e9eef9 100%);padding-top:58px}
.wave{position:absolute;left:0;width:100%;pointer-events:none;z-index:0}
.wave.top{top:0;height:230px}
.wave.bottom{bottom:0;height:190px}

@keyframes float{0%,100%{transform:translateY(0) rotate(var(--r,0deg))}50%{transform:translateY(var(--y,-10px)) rotate(var(--r,0deg))}}
.fl{animation:float var(--t,5s) ease-in-out var(--d,0s) infinite;will-change:transform}
@media (prefers-reduced-motion:reduce){.fl{animation:none}}

.dots{position:absolute;width:110px;height:110px;z-index:0;
  background-image:radial-gradient(circle,#8d97b8 2px,transparent 2.6px);background-size:18px 18px;opacity:.55}
.dots.d1{top:26px;left:20px}
.dots.d2{right:16px;top:790px;opacity:.4}

header{position:relative;z-index:3;display:flex;justify-content:center;padding:0 16px}
.logo-img{display:block;width:min(86%,430px);height:auto;mix-blend-mode:multiply}

.stage{position:relative;z-index:2;margin-top:18px;padding:0 9%}
.card{position:relative;z-index:3;background:rgba(255,255,255,.9);border-radius:22px;padding:10px;
  box-shadow:0 10px 34px rgba(30,50,120,.18),0 0 0 1px rgba(255,255,255,.8) inset}
.grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.tile{position:relative;aspect-ratio:1/1;border-radius:11px;border:1.5px solid var(--line);
  background:linear-gradient(145deg,#fff,#f4f5f8);box-shadow:inset 0 0 6px rgba(0,0,0,.06);overflow:hidden;padding:0;display:block}
.tile.has{cursor:pointer;transition:transform .18s,box-shadow .18s;border-color:#fff;box-shadow:0 2px 8px rgba(20,40,110,.28)}
.tile.has:hover,.tile.has:focus-visible{transform:scale(1.08);z-index:2;box-shadow:0 6px 16px rgba(20,40,110,.4);outline:2px solid var(--blue)}
.tile img{width:100%;height:100%;object-fit:cover;display:block;opacity:0;transition:opacity .3s}
.tile img.ok{opacity:1}
.tile .no{position:absolute;left:3px;top:3px;background:rgba(12,42,134,.88);color:#fff;font-size:9px;font-weight:700;line-height:1;padding:3px 4px;border-radius:6px}
.tile .st{position:absolute;right:3px;bottom:3px;font-size:9px;font-weight:800;line-height:1;padding:3px 4px;border-radius:6px;color:#fff}
.st.acc{background:#12a150}.st.rev{background:#e08a00}

.pager{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:10px;font-size:12px;font-weight:700;color:var(--navy);flex-wrap:wrap}
.pager button{background:linear-gradient(#1c58e0,#0f3aa8);color:#fff;border-radius:999px;padding:7px 14px;font-weight:800;font-size:12px;box-shadow:0 3px 8px rgba(15,58,168,.35)}
.pager button:disabled{opacity:.35;cursor:default}
.hint{text-align:center;font-size:11px;color:#56608a;margin-top:8px;font-weight:500;line-height:1.4}

.orn{position:absolute;z-index:1;pointer-events:none}
.orn.banner{left:-3%;top:8%;width:24%}
.orn.brosur{right:-4%;top:-1%;width:26%}
.orn.redbox{right:-5%;top:50%;width:17%;opacity:.8;filter:blur(1.5px)}
.orn.mug{right:-3%;bottom:6%;width:22%}
.orn.roll{left:-5%;bottom:-3%;width:25%}

.layanan{position:relative;z-index:3;margin-top:36px;padding:0 16px}
.ltitle{display:flex;align-items:center;justify-content:center;gap:12px}
.ltitle span{font-weight:900;font-style:italic;font-size:clamp(22px,6vw,30px);color:var(--navy);text-shadow:0 2px 3px rgba(12,42,134,.2)}
.ltitle i{flex:0 0 18%;height:3px;background:linear-gradient(90deg,transparent,var(--red))}
.ltitle i:last-child{background:linear-gradient(270deg,transparent,var(--red))}
.svc{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin-top:18px}
.svc div{display:flex;flex-direction:column;align-items:center;text-align:center}
.ico{width:clamp(54px,15vw,72px);aspect-ratio:1;border-radius:50%;display:grid;place-items:center;
  box-shadow:0 8px 14px rgba(20,30,90,.3),inset 0 -6px 10px rgba(0,0,0,.18),inset 0 4px 8px rgba(255,255,255,.35)}
.ico.r{background:radial-gradient(circle at 35% 25%,#ff5a66,#c4000f)}
.ico.b{background:radial-gradient(circle at 35% 25%,#2d63e6,#0a2a86)}
.ico svg{width:52%;height:52%;fill:none;stroke:#fff;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.svc p{margin-top:8px;font-size:clamp(10px,2.8vw,14px);font-weight:800;color:var(--navy);line-height:1.15;text-transform:uppercase}

.cta{position:relative;z-index:3;display:flex;justify-content:center;margin-top:26px;padding:0 16px 84px}
.cta a{display:flex;align-items:center;justify-content:space-between;gap:16px;text-decoration:none;color:#fff;
  font-weight:800;font-size:clamp(18px,5vw,24px);padding:10px 14px 10px 36px;border-radius:999px;min-width:min(78%,330px);
  background:linear-gradient(#f5303f,#c2000f);box-shadow:0 10px 18px rgba(194,0,15,.4),inset 0 2px 3px rgba(255,255,255,.35)}
.cta a:hover{filter:brightness(1.07)}
.cta .arr{width:38px;height:38px;border-radius:50%;background:#fff;display:grid;place-items:center;flex:none}
.cta .arr svg{width:18px;height:18px;stroke:#c2000f;stroke-width:3.5;fill:none;stroke-linecap:round;stroke-linejoin:round}

/* tombol owner (hanya tampil untuk pemilik) */
.ownbtn{position:fixed;z-index:40;right:max(14px,env(safe-area-inset-right,0px));bottom:max(14px,env(safe-area-inset-bottom,0px));
  background:#10163a;color:#fff;border-radius:999px;padding:11px 16px;font-weight:800;font-size:13px;box-shadow:0 6px 18px rgba(0,0,0,.35)}

/* modal */
.modal{position:fixed;inset:0;z-index:50;display:none;align-items:center;justify-content:center;padding:10px;background:rgba(8,20,60,.78)}
.modal.on{display:flex}
.sheet{position:relative;background:#fff;color:var(--ink);border-radius:20px;width:min(96vw,920px);max-height:96vh;overflow:auto;padding:14px;box-shadow:0 20px 60px rgba(0,0,0,.5);animation:pop .22s ease}
@keyframes pop{from{opacity:0;transform:scale(.94) translateY(10px)}to{opacity:1;transform:none}}
.mhead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
.mhead h3{font-size:16px;font-weight:800;color:var(--navy);font-style:italic;min-width:0}
.mhead h3 small{display:block;font-size:11px;font-weight:500;color:#667;font-style:normal;overflow-wrap:anywhere}
.x{width:36px;height:36px;border-radius:50%;background:#eef1f9;color:var(--navy);font-size:22px;line-height:1;flex:none}
.imgwrap{position:relative;display:flex;justify-content:center;align-items:center;border-radius:12px;padding:8px;min-height:160px;
  background:repeating-conic-gradient(#f1f3f8 0 25%,#fff 0 50%) 0 0/18px 18px;overflow:auto}
.imgwrap img{max-width:100%;max-height:62vh;width:auto;height:auto;display:block;border-radius:6px}
.nav{position:absolute;z-index:2;top:50%;transform:translateY(-50%);width:40px;height:40px;border-radius:50%;background:rgba(12,42,134,.85);color:#fff;font-size:22px}
.nav.prev{left:6px}.nav.next{right:6px}
.nav:disabled{opacity:.25;cursor:default}
.acts{display:flex;gap:10px;margin-top:12px}
.acts button{flex:1;padding:13px 10px;border-radius:12px;font-weight:800;font-size:15px;color:#fff;letter-spacing:.5px}
.b-acc{background:linear-gradient(#1fbf68,#0d8f46);box-shadow:0 5px 12px rgba(13,143,70,.35)}
.b-rev{background:linear-gradient(#f5303f,#c2000f);box-shadow:0 5px 12px rgba(194,0,15,.35)}
.revbox{display:none;margin-top:12px}
.revbox.on{display:block}
.revbox textarea,.namebox input{width:100%;font:inherit;font-size:14px;padding:10px 12px;border:1.5px solid #c9cfdf;border-radius:10px;outline:none;background:#fff;color:var(--ink)}
.revbox textarea{min-height:100px;resize:vertical;margin-bottom:8px}
.revbox textarea:focus,.namebox input:focus{border-color:var(--blue)}
.send{width:100%;padding:13px;border-radius:12px;background:linear-gradient(#25d366,#128c4a);color:#fff;font-weight:800;font-size:15px}
.err{color:var(--red);font-size:12px;font-weight:700;margin:-2px 0 8px}
.namebox{margin-top:12px}

/* panel owner */
.op h4{font-size:13px;margin:14px 0 6px;color:var(--navy)}
.drop{display:block;border:2px dashed #9aa6cf;border-radius:14px;padding:18px;text-align:center;font-weight:700;font-size:13px;color:var(--navy);cursor:pointer;background:#f6f8fd}
.drop.over{background:#e3ebff;border-color:var(--blue)}
.drop input{display:none}
.drop small{display:block;font-weight:500;color:#667;margin-top:4px}
.prog{margin-top:10px;font-size:12px;font-weight:700;color:var(--navy);line-height:1.5;overflow-wrap:anywhere}
.prog .bad{color:var(--red)}
.plist{display:flex;flex-direction:column;gap:6px;margin-top:6px}
.prow{display:grid;grid-template-columns:28px 44px minmax(0,1fr) auto;gap:8px;align-items:center;border:1px solid #dfe4f1;border-radius:10px;padding:5px 8px}
.prow img{width:44px;height:44px;object-fit:cover;border-radius:6px;display:block}
.prow .n{font-size:12px;font-weight:800;color:var(--navy)}
.prow .nm{font-size:12px;overflow-wrap:anywhere;min-width:0}
.prow .bt{display:flex;gap:4px}
.prow .bt button{width:30px;height:30px;border-radius:8px;background:#eef1f9;color:var(--navy);font-weight:800;font-size:13px}
.prow .bt button.del{background:#fde7e9;color:var(--red);width:auto;padding:0 8px;font-size:11px}
.pub{width:100%;margin-top:12px;padding:13px;border-radius:12px;font-weight:800;font-size:14px;color:#fff;background:linear-gradient(#1c58e0,#0f3aa8)}
.pub:disabled{opacity:.4;cursor:default}
.note{font-size:11.5px;color:#56608a;line-height:1.5;margin-top:8px}
</style><div id="app"></div><template id="shell">

    $('modal').classList.add('on'); document.body.style.overflow = 'hidden';
  }
  function closeModal(){ $('modal').classList.remove('on'); document.body.style.overflow = ''; cur = -1; }
  function step(d){ var n = cur + d; if(n>=0 && n<photos.length){ openModal(n); page = Math.floor(n/PER); render(); } }
  $('mClose').onclick = closeModal;
  $('modal').addEventListener('click', function(e){ if(e.target === this) closeModal(); });
  $('mPrev').onclick = function(){ step(-1); };
  $('mNext').onclick = function(){ step(1); };
  document.addEventListener('keydown', function(e){
    if(e.key === 'Escape'){ if($('omodal').classList.contains('on')) closeOwner(); else if(cur >= 0) closeModal(); return; }
    if(cur < 0) return;
    if(e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
    if(e.key === 'ArrowLeft') step(-1);
    if(e.key === 'ArrowRight') step(1);
  });
  try{ $('mName').value = localStorage.getItem('rdw-name') || ''; }catch(e){}
  function who(){ var n = $('mName').value.trim(); try{ localStorage.setItem('rdw-name', n); }catch(e){} return n ? '\nNama: ' + n : ''; }
  $('bAcc').onclick = function(){
    var p = photos[cur]; if(!p) return;
    status[p.f] = 'acc'; saveStatus(); render();
    window.open(waLink('Halo RDW Printing,\nDesain foto No. ' + (cur+1) + ' (' + (p.n||'') + ') sudah *ACC* ✅' + who()), '_blank');
  };
  $('bRev').onclick = function(){ $('revbox').classList.toggle('on'); if($('revbox').classList.contains('on')) $('mNote').focus(); };
  $('bSend').onclick = function(){
    var p = photos[cur]; if(!p) return;
    var note = $('mNote').value.trim();
    if(!note){ $('mErr').hidden = false; $('mNote').focus(); return; }
    $('mErr').hidden = true;
    status[p.f] = 'rev'; saveStatus(); render();
    window.open(waLink('Halo RDW Printing,\nSaya ingin *REVISI* desain foto No. ' + (cur+1) + ' (' + (p.n||'') + ')' + who() + '\n\nCatatan revisi:\n' + note), '_blank');
  };

  /* ---------- simpan halaman (terbitkan) ---------- */
  function buildDoc(list){
    var data = JSON.stringify(list).replace(/</g, '\\u003c');
    return '<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>' + RESET + '</style></head><body>' +
      '<title>RDW Printing - Review Desain</title>' + FONT +
      '<style id="app-style">' + $('app-style').textContent + '</style>' +
      '<div id="app"></div><template id="shell">' + $('shell').innerHTML + '<\/template>' +
      '<script type="application/json" id="photo-data">' + data + '<\/script>' +
      '<script id="app-js">' + $('app-js').textContent + '<\/script></body></html>';
  }
  var artifact = null, assets = null;
  function publish(list){
    if(!artifact) return Promise.reject({code:'not_granted'});
    try{ sessionStorage.setItem('rdw-del', JSON.stringify(pendingDel)); }catch(e){}
    return artifact.publish(buildDoc(list));
  }
  function say(html){ $('prog').innerHTML = html; }
  function esc(s){ var d = document.createElement('div'); d.textContent = s; return d.innerHTML; }
  function errText(e){
    var c = e && e.code;
    if(c === 'too_large' || c === 'quota_or_state') return 'ruang penyimpanan penuh atau file terlalu besar';
    if(c === 'not_granted' || c === 'not_writer') return 'akun ini tidak punya izin mengubah halaman';
    if(c === 'rate_limited') return 'terlalu cepat, coba lagi sebentar';
    return (e && e.message) || 'gagal';
  }

  /* ---------- panel owner ---------- */
  function openOwner(){ $('omodal').classList.add('on'); document.body.style.overflow = 'hidden'; renderList(); }
  function closeOwner(){ $('omodal').classList.remove('on'); document.body.style.overflow = ''; }
  $('oClose').onclick = closeOwner;
  $('omodal').addEventListener('click', function(e){ if(e.target === this) closeOwner(); });

  function renderList(){
    $('oCount').textContent = photos.length;
    var box = $('plist'); box.textContent = '';
    photos.forEach(function(p, i){
      var r = document.createElement('div'); r.className = 'prow';
      var n = document.createElement('span'); n.className = 'n'; n.textContent = i+1;
      var im = document.createElement('img'); im.alt = ''; im.loading = 'lazy'; im.src = blob(p.t || p.f);
      var nm = document.createElement('span'); nm.className = 'nm'; nm.textContent = p.n || '';
      var bt = document.createElement('span'); bt.className = 'bt';
      var up = document.createElement('button'); up.type = 'button'; up.textContent = '↑'; up.setAttribute('aria-label','Naikkan'); up.disabled = i === 0;
      var dn = document.createElement('button'); dn.type = 'button'; dn.textContent = '↓'; dn.setAttribute('aria-label','Turunkan'); dn.disabled = i === photos.length-1;
      var del = document.createElement('button'); del.type = 'button'; del.className = 'del'; del.textContent = 'Hapus';
      up.onclick = function(){ swap(i, i-1); };
      dn.onclick = function(){ swap(i, i+1); };
      del.onclick = function(){
        if(del.dataset.sure !== '1'){ del.dataset.sure = '1'; del.textContent = 'Yakin?'; return; }
        var q = photos.splice(i,1)[0]; pendingDel.push(q.f); if(q.t) pendingDel.push(q.t);
        setDirty(); render(); renderList();
      };
      bt.appendChild(up); bt.appendChild(dn); bt.appendChild(del);
      r.appendChild(n); r.appendChild(im); r.appendChild(nm); r.appendChild(bt);
      box.appendChild(r);
    });
  }
  function swap(a,b){ var t = photos[a]; photos[a] = photos[b]; photos[b] = t; setDirty(); render(); renderList(); }
  function setDirty(){ dirty = true; $('pub').disabled = false; }
  $('pub').onclick = function(){
    $('pub').disabled = true; say('Menerbitkan...');
    // hapus file lama lebih dulu (jika diminta), lalu terbitkan
    var jobs = pendingDel.map(function(id){ return assets ? assets.delete(id).catch(function(){}) : Promise.resolve(); });
    Promise.all(jobs).then(function(){ pendingDel = []; return publish(photos); })
      .catch(function(e){ if(e && e.code === 'conflict') return; say('<span class="bad">Gagal menerbitkan: ' + esc(errText(e)) + '</span>'); $('pub').disabled = false; });
  };

  /* ---------- unggah ---------- */
  function toBlob(canvas, q){ return new Promise(function(res){ canvas.toBlob(res, 'image/jpeg', q); }); }
  function scaled(bmp, max, q){
    var s = Math.min(1, max / Math.max(bmp.width, bmp.height));
    var c = document.createElement('canvas'); c.width = Math.max(1, Math.round(bmp.width*s)); c.height = Math.max(1, Math.round(bmp.height*s));
    var x = c.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0,0,c.width,c.height); x.drawImage(bmp, 0, 0, c.width, c.height);
    return toBlob(c, q);
  }
  var OKTYPES = {'image/jpeg':1,'image/png':1,'image/webp':1};
  async function processFile(file){
    var bmp = await createImageBitmap(file);
    var thumb = await scaled(bmp, 480, 0.8);
    var full = file;
    if(!OKTYPES[file.type] || file.size > 8*1024*1024) full = await scaled(bmp, 3000, 0.9);
    if(bmp.close) bmp.close();
    var up1 = await assets.upload(full);
    var up2 = await assets.upload(thumb);
    return {f: up1.id, t: up2.id, n: file.name.replace(/\.[^.]+$/, '')};
  }
  async function handleFiles(fl){
    if(!assets) return;
    var files = Array.prototype.slice.call(fl).filter(function(f){ return /^image\//.test(f.type); });
    if(!files.length){ say('<span class="bad">Tidak ada file gambar yang dipilih.</span>'); return; }
    files.sort(function(a,b){ return a.name.localeCompare(b.name, undefined, {numeric:true}); });
    var added = [], fails = [];
    for(var i=0;i<files.length;i++){
      say('Mengunggah ' + (i+1) + ' / ' + files.length + ': ' + esc(files[i].name));
      try{ added.push(await processFile(files[i])); }
      catch(e){ fails.push(files[i].name + ' (' + errText(e) + ')'); }
    }
    if(!added.length){ say('<span class="bad">Semua file gagal: ' + esc(fails.join('; ')) + '</span>'); return; }
    photos = photos.concat(added);
    render(); renderList();
    say('Menerbitkan ' + added.length + ' foto...' + (fails.length ? ' <span class="bad">Gagal: ' + esc(fails.join('; ')) + '</span>' : ''));
    try{ await publish(photos); }
    catch(e){ if(!(e && e.code === 'conflict')) say('<span class="bad">Foto terunggah, tapi gagal diterbitkan: ' + esc(errText(e)) + '. Tekan tombol Terbitkan.</span>'); setDirty(); }
  }
  $('files').onchange = function(){ handleFiles(this.files); this.value = ''; };
  var drop = $('drop');
  ['dragenter','dragover'].forEach(function(ev){ drop.addEventListener(ev, function(e){ e.preventDefault(); drop.classList.add('over'); }); });
  ['dragleave','drop'].forEach(function(ev){ drop.addEventListener(ev, function(e){ e.preventDefault(); drop.classList.remove('over'); }); });
  drop.addEventListener('drop', function(e){ if(e.dataTransfer && e.dataTransfer.files) handleFiles(e.dataTransfer.files); });
  $('ownBtn').onclick = openOwner;

  render();

  /* ---------- kemampuan platform (hanya pemilik/editor) ---------- */
  (async function(){
    try{
      if(!window.claude || !window.claude.use) return;
      artifact = await window.claude.use('artifact');
      assets = await window.claude.use('assets');
      if(!artifact || !assets) return;
      $('ownBtn').hidden = false;
      var del = [];
      try{ del = JSON.parse(sessionStorage.getItem('rdw-del') || '[]'); sessionStorage.removeItem('rdw-del'); }catch(e){}
      del.forEach(function(id){ assets.delete(id).catch(function(){}); });
      if(location.hash === '#owner') openOwner();
    }catch(e){}
  })();
})();
</script>
</body></html>
